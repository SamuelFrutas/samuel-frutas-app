name: Android APK

# Native Android build. Uses one stable debug signing key so APK updates
# install over the previous build without requiring an uninstall.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure stable Android debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo '' | base64 --decode > "$HOME/.android/debug.keystore"
      - name: Apply Brazilian price input formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/br/com/samuelfrutas/app/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = 'val price = field("Preço", if (measure.price == 0.0) "" else String.format(Locale.US, "%.2f", measure.price), InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL)'
          new = 'val price = field("Preço", if (measure.price == 0.0) "" else String.format(Locale.US, "%.2f", measure.price).replace(".", ","), InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL)\n        price.keyListener = android.text.method.DigitsKeyListener.getInstance("0123456789,")'
          if old not in s:
              raise SystemExit('Preço: linha esperada não encontrada')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Build release-ready debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samuel-frutas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
